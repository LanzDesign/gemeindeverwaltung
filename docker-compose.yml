version: '3.8'

services:
  # 1. Datenbank Service
  db:
    image: postgres:15-alpine
    container_name: fecg_db
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    env_file:
      - ./backend/.env
    ports:
      - "5433:5432"
    networks:
      - fecg-network

  # 2. Backend Service (Django)
  backend:
    build: ./backend
    container_name: fecg_backend
    restart: always
    # --insecure ist gut für statische Dateien im Testbetrieb
    command: python manage.py runserver 0.0.0.0:8000 --insecure
    volumes:
      - ./backend:/app
    ports:
      - "8001:8000"
    env_file:
      - ./backend/.env
    depends_on:
      - db
    networks:
      - fecg-network

  # 3. Frontend Service (React + Nginx)
  frontend:
    build:
      context: ./frontend
      args:
        # Hier die korrekte Subdomain für den Build
        VITE_API_URL: "https://api.fecg-lahr-app.de"
    container_name: frontend
    restart: always
    ports:
      - "3001:80"
    networks:
      - fecg-network

volumes:
  postgres_data:

networks:
  fecg-network:
    name: fecg-lahr_fecg-network
    driver: bridge
