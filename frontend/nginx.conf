server {
    listen 80;
    
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        # WICHTIG: Leitet alle Anfragen auf index.html um (für React Router)
        try_files $uri $uri/ /index.html;
    }

    # Fehlerseiten
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
